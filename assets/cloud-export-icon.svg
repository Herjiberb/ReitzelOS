<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="500" y1="60" x2="500" y2="940"><stop offset="0" stop-color="#2f5bff"/><stop offset=".55" stop-color="#5aa9ff"/><stop offset="1" stop-color="#9be1ff"/></linearGradient>
<linearGradient id="cloud" gradientUnits="userSpaceOnUse" x1="500" y1="130" x2="500" y2="370"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe8ff"/></linearGradient>
<linearGradient id="hillBack" gradientUnits="userSpaceOnUse" x1="500" y1="580" x2="500" y2="940"><stop offset="0" stop-color="#7cf0b0"/><stop offset="1" stop-color="#2fc58a"/></linearGradient>
<linearGradient id="hillFront" gradientUnits="userSpaceOnUse" x1="500" y1="640" x2="500" y2="940"><stop offset="0" stop-color="#2fd37f"/><stop offset="1" stop-color="#0f9a62"/></linearGradient>
<linearGradient id="fCoral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a7a"/><stop offset="1" stop-color="#ff4d6d"/></linearGradient>
<linearGradient id="fAmber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd54a"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>
<linearGradient id="fPink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9ad5"/><stop offset="1" stop-color="#e83fb0"/></linearGradient>
<linearGradient id="fViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b78bff"/><stop offset="1" stop-color="#7a3cff"/></linearGradient>
<linearGradient id="fWhite" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3ecff"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0a1f66" flood-opacity=".3"/></filter>
<filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a1f66" flood-opacity=".25"/></filter>
<clipPath id="disc"><circle cx="500" cy="500" r="440"/></clipPath>
<path id="file" d="M-30 -40H8L30 -18V32Q30 40 22 40H-22Q-30 40 -30 32Z"/>
<path id="fold" d="M8 -40V-24Q8 -18 14 -18H30Z"/>
</defs>
<!-- round badge -->
<circle cx="500" cy="500" r="440" fill="url(#sky)" filter="url(#sh)"/>
<g clip-path="url(#disc)">
<path fill="url(#hillBack)" d="M280 800C480 560 760 580 1000 660V1000H280Z"/>
<path fill="url(#hillFront)" d="M0 760C200 640 420 640 560 720C680 790 820 720 1000 700V1000H0Z"/>
</g>
<!-- rain streaks -->
<g stroke="#ffffff" stroke-opacity=".7" stroke-width="10" stroke-linecap="round" fill="none">
<path d="M375 392V414"/><path d="M510 400V428"/><path d="M640 390V412"/>
</g>
<!-- cloud -->
<g fill="url(#cloud)" filter="url(#sh2)">
<rect x="300" y="270" width="380" height="100" rx="50"/>
<circle cx="395" cy="275" r="80"/>
<circle cx="510" cy="235" r="105"/>
<circle cx="620" cy="280" r="68"/>
</g>
<!-- falling files -->
<g filter="url(#sh2)">
<g transform="translate(380 485) rotate(-12) scale(1.1)"><use href="#file" fill="url(#fCoral)"/><use href="#fold" fill="#fff" fill-opacity=".5"/></g>
<g transform="translate(510 570) rotate(10) scale(1.15)"><use href="#file" fill="url(#fAmber)"/><use href="#fold" fill="#fff" fill-opacity=".5"/></g>
<g transform="translate(640 480) rotate(14) scale(1.1)"><use href="#file" fill="url(#fPink)"/><use href="#fold" fill="#fff" fill-opacity=".5"/></g>
<g transform="translate(600 668) rotate(-8) scale(1.1)"><use href="#file" fill="url(#fViolet)"/><use href="#fold" fill="#fff" fill-opacity=".5"/></g>
<g transform="translate(285 620) rotate(-18) scale(1.1)"><use href="#file" fill="url(#fWhite)"/><use href="#fold" fill="#7aa2ff" fill-opacity=".45"/></g>
</g>
</svg>
